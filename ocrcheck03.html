<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>限定ページ</title>
<style>
body{background:#14161a;color:#e8eaf0;font-family:"Yu Gothic UI",Meiryo,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#1d2026;border:1px solid #333;border-radius:12px;padding:28px 30px;max-width:340px;width:90%}
h1{font-size:15px;color:#7ab8ff;margin:0 0 14px}
input{width:100%;box-sizing:border-box;background:#262a33;color:#e8eaf0;border:1px solid #444;border-radius:6px;padding:10px;font-size:15px}
button{width:100%;margin-top:12px;background:#1d3652;color:#fff;border:1px solid #7ab8ff;border-radius:6px;padding:10px;font-size:14px;cursor:pointer}
#msg{color:#ff9aa8;font-size:12px;min-height:16px;margin-top:8px}
</style></head><body>
<div class="box"><h1>パスワードを入力してください</h1>
<input id="pw" type="password" autofocus>
<button id="go">開く</button><div id="msg"></div></div>
<script>
var B64="GRdFxFm2aHynLqE9O8ItH9OF3mvoB1sSRer23T+z5kvHTKi26jE3cnTTcS15Y1TReQ6bvB9AUMRR2L62uXVVALLuSfSiO9hm3OMPBrH05WaFVQ7u8Zw5x9bYzQPCwAGR1YgHMBAlfKpftpJYQF7PKgwrcG2fup3hzYQRNMjv2NDW5aOwTQkhZGdR2W/SVcGXkD8xeNprn8o1nwO+gh1/6Y4MJWYt5B6psCXrOfbvSDuJ5Ne6Jhpytu1ff1l3xr1c0DIlNLgrDw6V9ZFH7R/YNcTbB2Jr4Pb/d2SeHUpCCYDsmPPD5lCGUgKQD1cRoZ8uQ03RWyKeLyIg8EOYCTf4STYYd13U0m9QW9R4bQkbpZqOhRdz5TOmNFzqwsbJ1atWHZM6OQzwcTWdEq/6QCZxn1AyW+blo4FPiE65rXOhW/8gu8AlZn80zNsSH1h80QUUXrWMCnN4gkarTDcSzir2302DF+7YQ44ukn0TT27YOVQ3e8yIjOEIGmpV4eo+O4kjrO03UHsAXEysMvEaLqOARpwX2obS/YCOm3GlzyKfR8ElhdMD5gQhxbVuJe7/4uyJ6BX76VcaZ/UnV+c1UMGQeUurK6f6FIyAtgTJgyrqeLmu2Ui2oX6hBrB4YZ6E";
function ab(b64){var s=atob(b64),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function unlock(pw){
  var raw=ab(B64),salt=raw.slice(0,16),nonce=raw.slice(16,28),ct=raw.slice(28);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:nonce},key,ct);
  return new TextDecoder().decode(pt);}
async function go(){
  var pw=document.getElementById("pw").value;
  if(!pw)return;
  document.getElementById("msg").textContent="復号中...";
  try{var html=await unlock(pw);
    sessionStorage.setItem("pgpw",pw);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById("msg").textContent="パスワードが違います";}}
document.getElementById("go").addEventListener("click",go);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
(function(){var s=sessionStorage.getItem("pgpw");
  if(s){unlock(s).then(function(html){document.open();document.write(html);document.close();}).catch(function(){sessionStorage.removeItem("pgpw");});}})();
</script></body></html>
